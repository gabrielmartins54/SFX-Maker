[package]
name = "sfx_maker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "wayland", "x11"] }
egui = "0.37.0"
fontdb = "0.24.0"
i_overlay = "9.1.0"
image = "0.25.10"
kurbo = { version = "0.13.1", features = ["serde"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
ttf-parser = "0.25.1"
